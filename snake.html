<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #eee;
    }
    h1 { font-size: 2rem; margin-bottom: 8px; color: #4ecca3; letter-spacing: 4px; }
    #score-board {
      display: flex;
      gap: 40px;
      margin-bottom: 12px;
      font-size: 1rem;
    }
    #score-board span { color: #4ecca3; font-weight: bold; }
    canvas {
      border: 2px solid #4ecca3;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
    }
    canvas.bot-active {
      border-color: #f4a261;
      box-shadow: 0 0 20px rgba(244, 162, 97, 0.4);
    }
    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #overlay h2 { font-size: 2rem; color: #e94560; }
    #overlay p { color: #aaa; }
    #overlay .key { color: #4ecca3; font-weight: bold; }
    #controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }
    #hint { font-size: 0.8rem; color: #666; }
    #bot-btn {
      background: transparent;
      border: 2px solid #f4a261;
      color: #f4a261;
      padding: 6px 18px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      cursor: pointer;
      letter-spacing: 2px;
      transition: background 0.15s, color 0.15s;
    }
    #bot-btn:hover { background: #f4a261; color: #1a1a2e; }
    #bot-btn.on { background: #f4a261; color: #1a1a2e; }
    #bot-status { font-size: 0.75rem; color: #f4a261; height: 1em; letter-spacing: 1px; }
    #speed-group { display: flex; align-items: center; gap: 4px; }
    #speed-label { font-size: 0.75rem; color: #666; margin-right: 2px; letter-spacing: 1px; }
    .spd {
      background: transparent;
      border: 1px solid #4ecca355;
      color: #4ecca3;
      padding: 4px 9px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .spd:hover  { border-color: #4ecca3; background: #4ecca322; }
    .spd.active { background: #4ecca3;   color: #1a1a2e; border-color: #4ecca3; }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="score-board">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
  </div>
  <div style="position:relative;">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">SNAKE</h2>
      <p>Use <span class="key">WASD</span> or <span class="key">Arrow Keys</span> to move</p>
      <p>Press <span class="key">SPACE</span> to start</p>
    </div>
  </div>
  <div id="controls">
    <div id="hint">P = pause &nbsp;|&nbsp; [ ] = speed</div>
    <button id="bot-btn">BOT: OFF</button>
    <div id="bot-status"></div>
    <div id="speed-group">
      <span id="speed-label">SPEED:</span>
      <button class="spd active" data-mult="1">1×</button>
      <button class="spd" data-mult="2">2×</button>
      <button class="spd" data-mult="5">5×</button>
      <button class="spd" data-mult="10">10×</button>
      <button class="spd" data-mult="20">20×</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const botBtn = document.getElementById('bot-btn');
    const botStatus = document.getElementById('bot-status');

    const GRID = 20;
    const COLS = canvas.width  / GRID;   // 20
    const ROWS = canvas.height / GRID;   // 20
    const TICK = 120;

    let snake, dir, nextDir, food, score, best, state, interval;
    let botActive = false;
    best = 0;

    // ── Speed control ──────────────────────────────────────────────────────────
    let speedMult = 1;
    const spdBtns = document.querySelectorAll('.spd');

    function setSpeed(mult) {
      speedMult = mult;
      spdBtns.forEach(b => b.classList.toggle('active', +b.dataset.mult === mult));
      if (state === 'playing') {
        clearInterval(interval);
        interval = setInterval(tick, Math.max(1, Math.round(TICK / speedMult)));
      }
    }

    spdBtns.forEach(b => b.addEventListener('click', () => setSpeed(+b.dataset.mult)));

    const SPEED_STEPS = [1, 2, 5, 10, 20];
    function stepSpeed(dir) {
      const idx = SPEED_STEPS.indexOf(speedMult);
      const next = SPEED_STEPS[Math.min(Math.max(idx + dir, 0), SPEED_STEPS.length - 1)];
      setSpeed(next);
    }

    // ── Utility ────────────────────────────────────────────────────────────────

    const wrap    = (v, max) => (v + max) % max;
    const cellKey = (x, y)  => x * 100 + y;

    const DIRS = [
      { x: 1, y: 0 }, { x: -1, y: 0 },
      { x: 0, y: 1 }, { x: 0, y: -1 },
    ];

    // ── Hamiltonian cycle (boustrophedon) ──────────────────────────────────────
    // Even rows sweep left→right; odd rows right→left.
    // On a toroidal grid the last cell (0, ROWS-1) is adjacent to (0, 0) via the
    // vertical wrap, so the path closes into a perfect cycle that visits every
    // cell exactly once.  Following it strictly guarantees no dead ends can form.

    const HAM_POS  = {};         // cellKey(x,y) → 0-based position in cycle
    const HAM_CELL = [];         // cycle position → {x, y}
    (function buildHamCycle() {
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const pos = (y % 2 === 0) ? (y * COLS + x) : (y * COLS + (COLS - 1 - x));
          HAM_POS[cellKey(x, y)] = pos;
          HAM_CELL[pos] = { x, y };
        }
      }
    })();

    // Return the cell that immediately follows (x, y) in the Hamiltonian cycle.
    function hamCycleNext(x, y) {
      return HAM_CELL[(HAM_POS[cellKey(x, y)] + 1) % (COLS * ROWS)];
    }

    // ── Bot: flood fill ────────────────────────────────────────────────────────

    function floodFill(sx, sy, blocked) {
      const visited = new Set();
      const queue   = [{ x: sx, y: sy }];
      visited.add(cellKey(sx, sy));
      while (queue.length) {
        const { x, y } = queue.shift();
        for (const d of DIRS) {
          const nx = wrap(x + d.x, COLS);
          const ny = wrap(y + d.y, ROWS);
          const k  = cellKey(nx, ny);
          if (!visited.has(k) && !blocked.has(k)) {
            visited.add(k);
            queue.push({ x: nx, y: ny });
          }
        }
      }
      return visited.size;
    }

    // ── Bot: main step ─────────────────────────────────────────────────────────

    // Strategy: a boustrophedon Hamiltonian cycle is the backbone — following it
    // blindly visits every cell exactly once and closes into a loop, so the snake
    // can NEVER trap itself and deterministically fills the board.  Blindly
    // following it is slow, so we allow "shortcuts": the head may jump forward
    // along the cycle (to an adjacent cell with a higher cycle index) toward the
    // food, but only as far as it can WITHOUT overtaking the tail.  The exact
    // amount it may safely cut is rel(head, tail) − 1 cells in cycle order; this
    // single invariant — the tail always stays ahead of the head along the cycle —
    // is what makes every move provably safe.  Shortcuts switch off once the board
    // is half full, so the end-game is pure cycle-following and the board fills to
    // (essentially) 400.  A flood-fill fallback recovers if the bot is toggled on
    // while the snake is in an arbitrary, non-cycle-aligned shape.

    function botStep() {
      const N    = COLS * ROWS;
      const head = snake[0];
      const tail = snake[snake.length - 1];
      const bodySet = new Set(snake.map(s => cellKey(s.x, s.y)));

      const headPos = HAM_POS[cellKey(head.x, head.y)];
      const tailPos = HAM_POS[cellKey(tail.x, tail.y)];
      const foodPos = HAM_POS[cellKey(food.x, food.y)];

      // Forward distance along the cycle from a to b (0 … N-1).
      const rel = (a, b) => (b - a + N) % N;

      const distToTail = rel(headPos, tailPos);
      const distToFood = rel(headPos, foodPos);
      const emptyAhead = N - snake.length;

      // How far we may cut this move:
      //   • Never cut past the tail: leave ≥1 cell of slack  → distToTail − 1.
      //     (This also absorbs the one-tick growth when the cut lands on food.)
      //   • Never overshoot the food, and only cut when the food lies ahead of us
      //     inside that safe window; otherwise just ride the cycle until it does.
      //   • Stop cutting once the board is half full, so the end-game is pure
      //     cycle-following and the board fills completely.
      let cutting = 0;
      if (distToFood <= distToTail - 1) cutting = distToFood;
      if (emptyAhead < N * 0.5)         cutting = 0;

      // Examine the four neighbours.  Among free cells, take the largest legal
      // forward jump (best shortcut); otherwise fall back to the plain cycle step.
      let shortcutDir = null, shortcutDist = 0;
      let cycleDir    = null;                       // the dist === 1 neighbour
      let anyFree     = false;

      for (const d of DIRS) {
        const nx = wrap(head.x + d.x, COLS);
        const ny = wrap(head.y + d.y, ROWS);
        const k  = cellKey(nx, ny);
        const isTail = (nx === tail.x && ny === tail.y);
        if (bodySet.has(k) && !isTail) continue;    // occupied (tail vacates this tick)
        anyFree = true;

        const dist = rel(headPos, HAM_POS[k]);      // 1 … N-1
        if (dist === 1) cycleDir = d;
        if (dist <= cutting && dist > shortcutDist) { shortcutDist = dist; shortcutDir = d; }
      }

      if (shortcutDir && shortcutDist > 1) {
        nextDir = shortcutDir;
        botStatus.textContent = 'SHORTCUT';
        return;
      }
      if (cycleDir) {
        nextDir = cycleDir;
        botStatus.textContent = emptyAhead < N * 0.5 ? 'HAMILTONIAN' : 'CYCLE';
        return;
      }

      // ── Fallback: the cycle step is blocked (snake not cycle-aligned, e.g. the
      // bot was switched on mid-game).  Survive by moving into the largest
      // reachable open space; this re-aligns the snake with the cycle over the
      // next few ticks, after which the logic above resumes.
      let bestSpace = -1, bestD = null;
      for (const d of DIRS) {
        const nx = wrap(head.x + d.x, COLS);
        const ny = wrap(head.y + d.y, ROWS);
        if (bodySet.has(cellKey(nx, ny))) continue;
        const space = floodFill(nx, ny, bodySet);
        if (space > bestSpace) { bestSpace = space; bestD = d; }
      }
      if (bestD) { nextDir = bestD; botStatus.textContent = 'RECOVER'; }
      else       { botStatus.textContent = 'TRAPPED'; }
    }

    // ── Game core ──────────────────────────────────────────────────────────────

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 },
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = 0;
      placeFood();
    }

    function placeFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS),
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function tick() {
      if (botActive) botStep();

      dir = nextDir;
      const head = {
        x: wrap(snake[0].x + dir.x, COLS),
        y: wrap(snake[0].y + dir.y, ROWS),
      };

      // ── FIX (Bug 1): tail vacates in the same tick unless food is eaten ──
      // Old code: snake.some(...) — included the tail, causing false collisions
      // when the bot (correctly) moved to where the tail was.
      const eatingFood = (head.x === food.x && head.y === food.y);
      const colBody    = eatingFood ? snake : snake.slice(0, -1);
      if (colBody.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (eatingFood) {
        score++;
        scoreEl.textContent = score;
        if (score > best) { best = score; bestEl.textContent = best; }
        // ── Win: the snake now fills every cell.  Without this guard placeFood()
        // would spin forever looking for a free cell that doesn't exist, freezing
        // the tab — the "unresponsive at the very end" symptom.
        if (snake.length === COLS * ROWS) { draw(); return youWin(); }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    // ── Rendering ──────────────────────────────────────────────────────────────

    function draw() {
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid dots
      ctx.fillStyle = '#1a2a4a';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          ctx.fillRect(c * GRID + GRID/2 - 1, r * GRID + GRID/2 - 1, 2, 2);
        }
      }

      // Food
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      const headColor = botActive ? '#f4a261' : '#4ecca3';
      snake.forEach((seg, i) => {
        const t = i / snake.length;
        ctx.fillStyle = i === 0
          ? headColor
          : botActive
            ? `hsl(${30 - t * 20}, 80%, ${50 - t * 15}%)`
            : `hsl(${160 - t * 40}, 70%, ${50 - t * 15}%)`;
        const pad = i === 0 ? 1 : 2;
        roundRect(ctx, seg.x * GRID + pad, seg.y * GRID + pad, GRID - pad*2, GRID - pad*2, 4);
        ctx.fill();

        if (i === 0) {
          ctx.fillStyle = '#16213e';
          const [ex1, ey1, ex2, ey2] = eyePositions(dir, seg);
          ctx.beginPath(); ctx.arc(ex1, ey1, 2, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex2, ey2, 2, 0, Math.PI*2); ctx.fill();
        }
      });
    }

    function eyePositions(d, seg) {
      const cx = seg.x * GRID + GRID/2, cy = seg.y * GRID + GRID/2, off = 4;
      if (d.x === 1)  return [cx+4, cy-off, cx+4, cy+off];
      if (d.x === -1) return [cx-4, cy-off, cx-4, cy+off];
      if (d.y === -1) return [cx-off, cy-4, cx+off, cy-4];
      return [cx-off, cy+4, cx+off, cy+4];
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
      ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
      ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
      ctx.closePath();
    }

    // ── State transitions ──────────────────────────────────────────────────────

    function gameOver() {
      clearInterval(interval);
      state = 'over';
      if (botActive) { setTimeout(startGame, 400); return; }
      overlayTitle.textContent = 'GAME OVER';
      overlayTitle.style.color = '#e94560';
      overlay.style.display = 'flex';
      overlay.children[1].textContent = `Score: ${score}`;
      overlay.children[2].innerHTML = 'Press <span class="key">SPACE</span> to play again';
    }

    function youWin() {
      clearInterval(interval);
      state = 'over';
      botStatus.textContent = botActive ? 'PERFECT — 400/400' : '';
      if (botActive) { setTimeout(startGame, 1500); return; }
      overlayTitle.textContent = 'PERFECT!';
      overlayTitle.style.color = '#4ecca3';
      overlay.style.display = 'flex';
      overlay.children[1].textContent = `Filled the whole grid — Score: ${score}`;
      overlay.children[2].innerHTML = 'Press <span class="key">SPACE</span> to play again';
    }

    function startGame() {
      overlay.style.display = 'none';
      init();
      state = 'playing';
      clearInterval(interval);
      interval = setInterval(tick, Math.max(1, Math.round(TICK / speedMult)));
      draw();
    }

    function pauseGame() {
      if (state === 'playing') {
        clearInterval(interval);
        state = 'paused';
        overlayTitle.textContent = 'PAUSED';
        overlayTitle.style.color = '#4ecca3';
        overlay.style.display = 'flex';
        overlay.children[1].textContent = '';
        overlay.children[2].innerHTML = 'Press <span class="key">P</span> or <span class="key">SPACE</span> to resume';
      } else if (state === 'paused') {
        overlay.style.display = 'none';
        state = 'playing';
        interval = setInterval(tick, Math.max(1, Math.round(TICK / speedMult)));
      }
    }

    function toggleBot() {
      botActive = !botActive;
      botBtn.textContent = `BOT: ${botActive ? 'ON' : 'OFF'}`;
      botBtn.classList.toggle('on', botActive);
      canvas.classList.toggle('bot-active', botActive);
      if (!botActive) botStatus.textContent = '';
      if (botActive && (state === 'idle' || state === 'over')) startGame();
    }

    // ── Input ──────────────────────────────────────────────────────────────────

    botBtn.addEventListener('click', toggleBot);

    document.addEventListener('keydown', e => {
      const k = e.key;
      if (k === 'b' || k === 'B') { toggleBot(); return; }
      if (k === ']') { stepSpeed(+1); return; }
      if (k === '[') { stepSpeed(-1); return; }
      if (k === ' ') {
        e.preventDefault();
        if (state === 'idle' || state === 'over') startGame();
        else if (state === 'paused') pauseGame();
        return;
      }
      if (k === 'p' || k === 'P') {
        if (state === 'playing' || state === 'paused') pauseGame();
        return;
      }
      if (state !== 'playing' || botActive) return;
      const moves = {
        ArrowUp:    { x:0, y:-1 }, w: { x:0, y:-1 }, W: { x:0, y:-1 },
        ArrowDown:  { x:0, y:1  }, s: { x:0, y:1  }, S: { x:0, y:1  },
        ArrowLeft:  { x:-1,y:0  }, a: { x:-1,y:0  }, A: { x:-1,y:0  },
        ArrowRight: { x:1, y:0  }, d: { x:1, y:0  }, D: { x:1, y:0  },
      };
      const m = moves[k];
      if (m && !(m.x === -dir.x && m.y === -dir.y)) { e.preventDefault(); nextDir = m; }
    });

    // Initial draw
    state = 'idle';
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  </script>
</body>
</html>
