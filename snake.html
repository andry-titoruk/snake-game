<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #eee;
    }
    h1 { font-size: 2rem; margin-bottom: 8px; color: #4ecca3; letter-spacing: 4px; }
    #score-board {
      display: flex;
      gap: 40px;
      margin-bottom: 12px;
      font-size: 1rem;
    }
    #score-board span { color: #4ecca3; font-weight: bold; }
    canvas {
      border: 2px solid #4ecca3;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
    }
    canvas.bot-active {
      border-color: #f4a261;
      box-shadow: 0 0 20px rgba(244, 162, 97, 0.4);
    }
    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #overlay h2 { font-size: 2rem; color: #e94560; }
    #overlay p { color: #aaa; }
    #overlay .key { color: #4ecca3; font-weight: bold; }
    #controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }
    #hint { font-size: 0.8rem; color: #666; }
    #bot-btn {
      background: transparent;
      border: 2px solid #f4a261;
      color: #f4a261;
      padding: 6px 18px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      cursor: pointer;
      letter-spacing: 2px;
      transition: background 0.15s, color 0.15s;
    }
    #bot-btn:hover { background: #f4a261; color: #1a1a2e; }
    #bot-btn.on { background: #f4a261; color: #1a1a2e; }
    #bot-status { font-size: 0.75rem; color: #f4a261; height: 1em; letter-spacing: 1px; }
    #speed-group { display: flex; align-items: center; gap: 4px; }
    #speed-label { font-size: 0.75rem; color: #666; margin-right: 2px; letter-spacing: 1px; }
    .spd {
      background: transparent;
      border: 1px solid #4ecca355;
      color: #4ecca3;
      padding: 4px 9px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .spd:hover  { border-color: #4ecca3; background: #4ecca322; }
    .spd.active { background: #4ecca3;   color: #1a1a2e; border-color: #4ecca3; }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="score-board">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
  </div>
  <div style="position:relative;">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">SNAKE</h2>
      <p>Use <span class="key">WASD</span> or <span class="key">Arrow Keys</span> to move</p>
      <p>Press <span class="key">SPACE</span> to start</p>
    </div>
  </div>
  <div id="controls">
    <div id="hint">P = pause &nbsp;|&nbsp; [ ] = speed</div>
    <button id="bot-btn">BOT: OFF</button>
    <div id="bot-status"></div>
    <div id="speed-group">
      <span id="speed-label">SPEED:</span>
      <button class="spd active" data-mult="1">1×</button>
      <button class="spd" data-mult="2">2×</button>
      <button class="spd" data-mult="5">5×</button>
      <button class="spd" data-mult="10">10×</button>
      <button class="spd" data-mult="20">20×</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const botBtn = document.getElementById('bot-btn');
    const botStatus = document.getElementById('bot-status');

    const GRID = 20;
    const COLS = canvas.width  / GRID;   // 20
    const ROWS = canvas.height / GRID;   // 20
    const TICK = 120;

    let snake, dir, nextDir, food, score, best, state, interval;
    let botActive = false;
    let survivalStreak = 0;   // ticks spent outside HUNTING mode
    const CYCLE_THRESHOLD = 50; // after this many ticks, relax food gate + label cycle
    best = 0;

    // ── Speed control ──────────────────────────────────────────────────────────
    let speedMult = 1;
    const spdBtns = document.querySelectorAll('.spd');

    function setSpeed(mult) {
      speedMult = mult;
      spdBtns.forEach(b => b.classList.toggle('active', +b.dataset.mult === mult));
      if (state === 'playing') {
        clearInterval(interval);
        interval = setInterval(tick, Math.max(1, Math.round(TICK / speedMult)));
      }
    }

    spdBtns.forEach(b => b.addEventListener('click', () => setSpeed(+b.dataset.mult)));

    const SPEED_STEPS = [1, 2, 5, 10, 20];
    function stepSpeed(dir) {
      const idx = SPEED_STEPS.indexOf(speedMult);
      const next = SPEED_STEPS[Math.min(Math.max(idx + dir, 0), SPEED_STEPS.length - 1)];
      setSpeed(next);
    }

    // ── Utility ────────────────────────────────────────────────────────────────

    const wrap    = (v, max) => (v + max) % max;
    const cellKey = (x, y)  => x * 100 + y;

    const DIRS = [
      { x: 1, y: 0 }, { x: -1, y: 0 },
      { x: 0, y: 1 }, { x: 0, y: -1 },
    ];

    // ── Hamiltonian cycle (boustrophedon) ──────────────────────────────────────
    // Even rows sweep left→right; odd rows right→left.
    // On a toroidal grid the last cell (0, ROWS-1) is adjacent to (0, 0) via the
    // vertical wrap, so the path closes into a perfect cycle that visits every
    // cell exactly once.  Following it strictly guarantees no dead ends can form.

    const HAM_THRESHOLD = 150;   // snake length at which Hamiltonian mode activates

    const HAM_POS  = {};         // cellKey(x,y) → 0-based position in cycle
    const HAM_CELL = [];         // cycle position → {x, y}
    (function buildHamCycle() {
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const pos = (y % 2 === 0) ? (y * COLS + x) : (y * COLS + (COLS - 1 - x));
          HAM_POS[cellKey(x, y)] = pos;
          HAM_CELL[pos] = { x, y };
        }
      }
    })();

    // Return the cell that immediately follows (x, y) in the Hamiltonian cycle.
    function hamCycleNext(x, y) {
      return HAM_CELL[(HAM_POS[cellKey(x, y)] + 1) % (COLS * ROWS)];
    }

    // ── Min-heap ───────────────────────────────────────────────────────────────

    class MinHeap {
      constructor() { this.h = []; }
      get size() { return this.h.length; }
      push(item) { this.h.push(item); this._up(this.h.length - 1); }
      pop() {
        const top = this.h[0];
        const last = this.h.pop();
        if (this.h.length) { this.h[0] = last; this._down(0); }
        return top;
      }
      _up(i) {
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (this.h[p].cost <= this.h[i].cost) break;
          [this.h[p], this.h[i]] = [this.h[i], this.h[p]];
          i = p;
        }
      }
      _down(i) {
        const n = this.h.length;
        while (true) {
          let m = i, l = 2*i+1, r = 2*i+2;
          if (l < n && this.h[l].cost < this.h[m].cost) m = l;
          if (r < n && this.h[r].cost < this.h[m].cost) m = r;
          if (m === i) break;
          [this.h[m], this.h[i]] = [this.h[i], this.h[m]];
          i = m;
        }
      }
    }

    // ── Bot: danger map ────────────────────────────────────────────────────────
    // Precomputed once per botStep call (O(N·r²) instead of O(N) per cell).
    // Segment i has persistence (length-i)/length — head = 1.0, tail ≈ 0.
    // Danger radiates outward, decaying as 1/dist².

    function buildDangerMap() {
      const map = new Map();
      const RADIUS = 5;
      for (let i = 0; i < snake.length; i++) {
        const seg = snake[i];
        const persistence = (snake.length - i) / snake.length;
        for (let dy = -RADIUS; dy <= RADIUS; dy++) {
          for (let dx = -RADIUS; dx <= RADIUS; dx++) {
            const dist = Math.abs(dx) + Math.abs(dy);
            if (dist === 0 || dist > RADIUS) continue;
            const nx = wrap(seg.x + dx, COLS);
            const ny = wrap(seg.y + dy, ROWS);
            const k  = cellKey(nx, ny);
            map.set(k, (map.get(k) || 0) + (persistence * 10) / (dist * dist));
          }
        }
      }
      return map;
    }

    // ── Bot: Dijkstra with full-path reconstruction ────────────────────────────
    // Returns array of {x,y} positions [step1, step2, ..., food], or null.
    // Each position is where the snake head will be after that step.

    function dijkstraToFood(bodySet, dangerMap) {
      const head    = snake[0];
      const headKey = cellKey(head.x, head.y);
      const dist    = new Map();
      // parent: childKey → { prevKey, x, y }  (position of child, key of parent)
      const parent  = new Map();
      const pq      = new MinHeap();

      dist.set(headKey, 0);
      pq.push({ cost: 0, x: head.x, y: head.y });

      let found = false;

      while (pq.size > 0) {
        const { cost, x, y } = pq.pop();
        const k = cellKey(x, y);
        if (cost > (dist.get(k) ?? Infinity) + 1e-9) continue;
        if (x === food.x && y === food.y) { found = true; break; }

        for (const d of DIRS) {
          const nx = wrap(x + d.x, COLS);
          const ny = wrap(y + d.y, ROWS);
          const nk = cellKey(nx, ny);
          if (bodySet.has(nk)) continue;

          // Cost = 1 (base) + precomputed danger for this cell
          const nc = cost + 1 + (dangerMap.get(nk) || 0);
          if (nc < (dist.get(nk) ?? Infinity)) {
            dist.set(nk, nc);
            parent.set(nk, { prevKey: k, x: nx, y: ny });
            pq.push({ cost: nc, x: nx, y: ny });
          }
        }
      }

      if (!found) return null;

      // Reconstruct path from food back to head
      const path = [];
      let curr = cellKey(food.x, food.y);
      while (parent.has(curr)) {
        const node = parent.get(curr);
        path.unshift({ x: node.x, y: node.y });
        curr = node.prevKey;
      }
      return path.length > 0 ? path : null;
    }

    // ── Bot: step-by-step path simulation ─────────────────────────────────────
    // Walks through every step of the path, updating the simulated snake body
    // at each tick (freeing the tail unless food is eaten).
    // Returns the final snake array, or null if any step causes a collision.
    //
    // This is the KEY fix: the old safety check only simulated 1 step, treating
    // it as if food were eaten there.  Here we simulate the whole multi-step
    // journey with the correct body configuration at every intermediate tick.

    function simulatePath(path) {
      let sim = snake.slice(); // shallow copy; positions are immutable objects
      for (const pos of path) {
        const eats = (pos.x === food.x && pos.y === food.y);
        // Conservative: check against the FULL simulated body including the tail.
        // The tail cell is treated as permanently occupied in the planning layer,
        // matching the conservative bodySet used by Dijkstra above.
        if (sim.some(s => s.x === pos.x && s.y === pos.y)) return null;
        sim = [pos, ...sim];
        if (!eats) sim.pop();
      }
      return sim; // final snake state after fully traversing path
    }

    // ── Bot: BFS (for tail-chasing survival) ──────────────────────────────────

    function bfs(sx, sy, gx, gy, blocked) {
      const visited = new Set();
      const queue   = [{ x: sx, y: sy, path: [] }];
      visited.add(cellKey(sx, sy));
      while (queue.length) {
        const { x, y, path } = queue.shift();
        for (const d of DIRS) {
          const nx = wrap(x + d.x, COLS);
          const ny = wrap(y + d.y, ROWS);
          const k  = cellKey(nx, ny);
          if (visited.has(k) || blocked.has(k)) continue;
          const np = [...path, { x: nx, y: ny }];
          if (nx === gx && ny === gy) return np;
          visited.add(k);
          queue.push({ x: nx, y: ny, path: np });
        }
      }
      return null;
    }

    // ── Bot: flood fill ────────────────────────────────────────────────────────

    function floodFill(sx, sy, blocked) {
      const visited = new Set();
      const queue   = [{ x: sx, y: sy }];
      visited.add(cellKey(sx, sy));
      while (queue.length) {
        const { x, y } = queue.shift();
        for (const d of DIRS) {
          const nx = wrap(x + d.x, COLS);
          const ny = wrap(y + d.y, ROWS);
          const k  = cellKey(nx, ny);
          if (!visited.has(k) && !blocked.has(k)) {
            visited.add(k);
            queue.push({ x: nx, y: ny });
          }
        }
      }
      return visited.size;
    }

    // ── Bot: fast reachability check (no path stored, O(cells)) ──────────────
    // Used in survival mode to verify the tail is still accessible from each
    // candidate neighbour without the cost of storing full path arrays.

    function canReach(sx, sy, gx, gy, blocked) {
      const visited = new Set();
      const queue   = [{ x: sx, y: sy }];
      visited.add(cellKey(sx, sy));
      while (queue.length) {
        const { x, y } = queue.shift();
        if (x === gx && y === gy) return true;
        for (const d of DIRS) {
          const nx = wrap(x + d.x, COLS);
          const ny = wrap(y + d.y, ROWS);
          const k  = cellKey(nx, ny);
          if (!visited.has(k) && !blocked.has(k)) {
            visited.add(k);
            queue.push({ x: nx, y: ny });
          }
        }
      }
      return false;
    }

    // ── Bot: main step ─────────────────────────────────────────────────────────

    function botStep() {
      const head = snake[0];
      const tail = snake[snake.length - 1];

      // Conservative bodySet includes the tail so paths never route through it.
      const bodySet      = new Set(snake.map(s => cellKey(s.x, s.y)));
      // bodySetNoTail used only where the tail itself is the goal/destination.
      const bodySetNoTail = new Set(snake.slice(0, -1).map(s => cellKey(s.x, s.y)));

      const dangerMap  = buildDangerMap();
      const isCycling  = survivalStreak > CYCLE_THRESHOLD;

      // ── 0. Hamiltonian cycle mode (snake.length ≥ HAM_THRESHOLD) ─────────────
      // At high density a boustrophedon Hamiltonian cycle eliminates dead ends by
      // design: the snake sweeps each row completely before U-turning to the next,
      // closing the loop via the toroidal bottom edge.
      //
      // Three-tier strategy that matches — never undercuts — the quality of the
      // normal Dijkstra + flood-fill tiers below:
      //   a) Dijkstra shortcut with the SAME open-space threshold as tier 1
      //      (60 % normal / 40 % cycling).  A more lenient gate here was the
      //      root cause of the performance regression: it approved paths that
      //      tier 1 would correctly reject, leaving the snake in worse positions.
      //   b) Flood-fill survival identical to tier 2, but with the Hamiltonian
      //      cycle direction used as a tiebreaker when two neighbours are equal.
      //      This keeps the snake space-aware while gently nudging it along the
      //      cycle so it doesn't need to rely on the strict step as often.
      //   c) Strict cycle step only as a true last resort — when every neighbour
      //      fails the flood-fill minimum.  Previously this fired as soon as (a)
      //      failed, overriding the flood-fill logic and causing avoidable deaths.
      if (snake.length >= HAM_THRESHOLD) {
        // — a) Dijkstra shortcut (same threshold as tier 1) —
        const hamPath = dijkstraToFood(bodySet, dangerMap);
        if (hamPath) {
          const hamFinal = simulatePath(hamPath);
          if (hamFinal) {
            const hamBlocked = new Set(hamFinal.slice(1).map(s => cellKey(s.x, s.y)));
            const hamOpen    = floodFill(hamFinal[0].x, hamFinal[0].y, hamBlocked);
            const hamAvail   = COLS * ROWS - hamBlocked.size;
            const hamRatio   = isCycling ? 0.4 : 0.6;
            if (hamOpen >= Math.max(4, Math.ceil(hamAvail * hamRatio))) {
              survivalStreak = 0;
              setNextDir(head, hamPath[0]);
              botStatus.textContent = 'HAM-HUNT';
              return;
            }
          }
        }

        // — b) Flood-fill survival with cycle tiebreaker —
        const cycleNext       = hamCycleNext(head.x, head.y);
        const minHamSpace     = Math.max(4, Math.floor(snake.length * 0.15));
        let hamBestSpace = -1, hamBestD = null;
        for (const d of DIRS) {
          const nx = wrap(head.x + d.x, COLS);
          const ny = wrap(head.y + d.y, ROWS);
          if (bodySet.has(cellKey(nx, ny))) continue;
          const space = floodFill(nx, ny, bodySet);
          if (space < minHamSpace) continue;
          // Prefer cycle direction on ties to gently align with the Hamiltonian path
          const isCycleDir = nx === cycleNext.x && ny === cycleNext.y;
          if (space > hamBestSpace || (space === hamBestSpace && isCycleDir)) {
            hamBestSpace = space; hamBestD = d;
          }
        }
        if (hamBestD) {
          survivalStreak++;
          nextDir = hamBestD;
          botStatus.textContent = isCycling ? 'HAM-CYCLE' : 'HAM-SURVIVE';
          return;
        }

        // — c) Strict cycle step (true last resort) —
        const cycleKey = cellKey(cycleNext.x, cycleNext.y);
        const isTail   = cycleNext.x === tail.x && cycleNext.y === tail.y;
        if (!bodySet.has(cycleKey) || isTail) {
          survivalStreak = 0;
          setNextDir(head, cycleNext);
          botStatus.textContent = 'HAMILTONIAN';
          return;
        }
        // Cycle step blocked after shortcuts → fall through to regular last resort.
      }

      // ── 1. Weighted Dijkstra → food ──────────────────────────────────────────
      const path = dijkstraToFood(bodySet, dangerMap);

      if (path) {
        const finalSnake = simulatePath(path);
        if (finalSnake) {
          const futureBlocked = new Set(finalSnake.slice(1).map(s => cellKey(s.x, s.y)));
          const openSpace     = floodFill(finalSnake[0].x, finalSnake[0].y, futureBlocked);

          // Gate: require access to a meaningful fraction of the FREE cells
          // from the food position — not an absolute count equal to snake length,
          // which becomes impossible at high density (snake = 200, grid = 400 →
          // only 200 cells are free total, so the old check could never pass).
          // availableCells = total grid minus everything that stays blocked after eating.
          const availableCells = COLS * ROWS - futureBlocked.size;
          const ratio     = isCycling ? 0.4 : 0.6;
          const threshold = Math.max(4, Math.ceil(availableCells * ratio));

          if (openSpace >= threshold) {
            survivalStreak = 0;
            setNextDir(head, path[0]);
            botStatus.textContent = isCycling ? 'BREAKING' : 'HUNTING';
            return;
          }
        }
      }

      // ── 2. Survival: gravitate toward maximum open space ─────────────────────
      //
      // Previous version used canReach(neighbour → tail) as a safety gate, but
      // at high densities (50 %+ of the grid filled) the tail is buried inside
      // the coil and genuinely unreachable from the open area — even though
      // the open area is the safest place to be.  The strict check caused the
      // bot to stay near the body (where the tail is reachable) and never enter
      // the large free zone where the food is.
      //
      // Fix: replace canReach with a flood-fill minimum threshold.  As long as
      // a direction opens onto enough free space, it is safe to take.  Pure
      // flood-fill maximisation already avoids pockets naturally.

      const minSurvivalSpace = Math.max(4, Math.floor(snake.length * 0.15));

      let bestSpace = -1, bestD = null;
      for (const d of DIRS) {
        const nx = wrap(head.x + d.x, COLS);
        const ny = wrap(head.y + d.y, ROWS);
        if (bodySet.has(cellKey(nx, ny))) continue;          // collision

        const space = floodFill(nx, ny, bodySet);
        if (space < minSurvivalSpace) continue;              // avoid tiny pockets
        if (space > bestSpace) { bestSpace = space; bestD = d; }
      }

      if (bestD) {
        survivalStreak++;
        nextDir = bestD;
        botStatus.textContent = isCycling ? 'CYCLE BREAK' : 'SURVIVING';
        return;
      }

      // ── 3. Last resort: any safe direction, most open space ──────────────────
      // (tail unreachable from all neighbours — very cornered)
      let fallbackSpace = -1, fallbackD = null;
      for (const d of DIRS) {
        const nx = wrap(head.x + d.x, COLS);
        const ny = wrap(head.y + d.y, ROWS);
        if (!bodySet.has(cellKey(nx, ny))) {
          const sp = floodFill(nx, ny, bodySet);
          if (sp > fallbackSpace) { fallbackSpace = sp; fallbackD = d; }
        }
      }

      if (fallbackD) { survivalStreak++; nextDir = fallbackD; botStatus.textContent = 'ESCAPING'; }
      else            { botStatus.textContent = 'TRAPPED'; }
    }

    function setNextDir(from, to) {
      let dx = to.x - from.x;
      let dy = to.y - from.y;
      // Handle toroidal wrap-around
      if (dx >  1) dx = -1; if (dx < -1) dx = 1;
      if (dy >  1) dy = -1; if (dy < -1) dy = 1;
      nextDir = { x: dx, y: dy };
    }

    // ── Game core ──────────────────────────────────────────────────────────────

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 },
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      survivalStreak = 0;
      scoreEl.textContent = 0;
      placeFood();
    }

    function placeFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS),
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function tick() {
      if (botActive) botStep();

      dir = nextDir;
      const head = {
        x: wrap(snake[0].x + dir.x, COLS),
        y: wrap(snake[0].y + dir.y, ROWS),
      };

      // ── FIX (Bug 1): tail vacates in the same tick unless food is eaten ──
      // Old code: snake.some(...) — included the tail, causing false collisions
      // when the bot (correctly) moved to where the tail was.
      const eatingFood = (head.x === food.x && head.y === food.y);
      const colBody    = eatingFood ? snake : snake.slice(0, -1);
      if (colBody.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (eatingFood) {
        score++;
        scoreEl.textContent = score;
        if (score > best) { best = score; bestEl.textContent = best; }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    // ── Rendering ──────────────────────────────────────────────────────────────

    function draw() {
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid dots
      ctx.fillStyle = '#1a2a4a';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          ctx.fillRect(c * GRID + GRID/2 - 1, r * GRID + GRID/2 - 1, 2, 2);
        }
      }

      // Food
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      const headColor = botActive ? '#f4a261' : '#4ecca3';
      snake.forEach((seg, i) => {
        const t = i / snake.length;
        ctx.fillStyle = i === 0
          ? headColor
          : botActive
            ? `hsl(${30 - t * 20}, 80%, ${50 - t * 15}%)`
            : `hsl(${160 - t * 40}, 70%, ${50 - t * 15}%)`;
        const pad = i === 0 ? 1 : 2;
        roundRect(ctx, seg.x * GRID + pad, seg.y * GRID + pad, GRID - pad*2, GRID - pad*2, 4);
        ctx.fill();

        if (i === 0) {
          ctx.fillStyle = '#16213e';
          const [ex1, ey1, ex2, ey2] = eyePositions(dir, seg);
          ctx.beginPath(); ctx.arc(ex1, ey1, 2, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex2, ey2, 2, 0, Math.PI*2); ctx.fill();
        }
      });
    }

    function eyePositions(d, seg) {
      const cx = seg.x * GRID + GRID/2, cy = seg.y * GRID + GRID/2, off = 4;
      if (d.x === 1)  return [cx+4, cy-off, cx+4, cy+off];
      if (d.x === -1) return [cx-4, cy-off, cx-4, cy+off];
      if (d.y === -1) return [cx-off, cy-4, cx+off, cy-4];
      return [cx-off, cy+4, cx+off, cy+4];
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
      ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
      ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
      ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
      ctx.closePath();
    }

    // ── State transitions ──────────────────────────────────────────────────────

    function gameOver() {
      clearInterval(interval);
      state = 'over';
      if (botActive) { setTimeout(startGame, 400); return; }
      overlayTitle.textContent = 'GAME OVER';
      overlayTitle.style.color = '#e94560';
      overlay.style.display = 'flex';
      overlay.children[1].textContent = `Score: ${score}`;
      overlay.children[2].innerHTML = 'Press <span class="key">SPACE</span> to play again';
    }

    function startGame() {
      overlay.style.display = 'none';
      init();
      state = 'playing';
      clearInterval(interval);
      interval = setInterval(tick, Math.max(1, Math.round(TICK / speedMult)));
      draw();
    }

    function pauseGame() {
      if (state === 'playing') {
        clearInterval(interval);
        state = 'paused';
        overlayTitle.textContent = 'PAUSED';
        overlayTitle.style.color = '#4ecca3';
        overlay.style.display = 'flex';
        overlay.children[1].textContent = '';
        overlay.children[2].innerHTML = 'Press <span class="key">P</span> or <span class="key">SPACE</span> to resume';
      } else if (state === 'paused') {
        overlay.style.display = 'none';
        state = 'playing';
        interval = setInterval(tick, Math.max(1, Math.round(TICK / speedMult)));
      }
    }

    function toggleBot() {
      botActive = !botActive;
      botBtn.textContent = `BOT: ${botActive ? 'ON' : 'OFF'}`;
      botBtn.classList.toggle('on', botActive);
      canvas.classList.toggle('bot-active', botActive);
      if (!botActive) botStatus.textContent = '';
      if (botActive && (state === 'idle' || state === 'over')) startGame();
    }

    // ── Input ──────────────────────────────────────────────────────────────────

    botBtn.addEventListener('click', toggleBot);

    document.addEventListener('keydown', e => {
      const k = e.key;
      if (k === 'b' || k === 'B') { toggleBot(); return; }
      if (k === ']') { stepSpeed(+1); return; }
      if (k === '[') { stepSpeed(-1); return; }
      if (k === ' ') {
        e.preventDefault();
        if (state === 'idle' || state === 'over') startGame();
        else if (state === 'paused') pauseGame();
        return;
      }
      if (k === 'p' || k === 'P') {
        if (state === 'playing' || state === 'paused') pauseGame();
        return;
      }
      if (state !== 'playing' || botActive) return;
      const moves = {
        ArrowUp:    { x:0, y:-1 }, w: { x:0, y:-1 }, W: { x:0, y:-1 },
        ArrowDown:  { x:0, y:1  }, s: { x:0, y:1  }, S: { x:0, y:1  },
        ArrowLeft:  { x:-1,y:0  }, a: { x:-1,y:0  }, A: { x:-1,y:0  },
        ArrowRight: { x:1, y:0  }, d: { x:1, y:0  }, D: { x:1, y:0  },
      };
      const m = moves[k];
      if (m && !(m.x === -dir.x && m.y === -dir.y)) { e.preventDefault(); nextDir = m; }
    });

    // Initial draw
    state = 'idle';
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  </script>
</body>
</html>
